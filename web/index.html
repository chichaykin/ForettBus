<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Forett Shuttle timetable, public-bus arrivals, routes and reminders.">
  <meta name="theme-color" content="#F7F9F2">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Forett Shuttle">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Forett Shuttle</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #f7f9f2;
    }

    #forett-loading {
      position: fixed;
      inset: 0;
      z-index: 2147483647;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      box-sizing: border-box;
      padding: 24px;
      color: #203d2b;
      background: #f7f9f2;
      font: 600 20px system-ui, -apple-system, sans-serif;
      text-align: center;
    }

    #forett-loading img {
      width: 88px;
      height: 88px;
      border-radius: 20px;
    }

    #forett-loading span {
      color: #46634e;
      font-size: 15px;
      font-weight: 400;
    }

    #forett-loading button {
      margin-top: 4px;
      padding: 10px 18px;
      border: 1px solid currentColor;
      border-radius: 999px;
      color: inherit;
      background: transparent;
      font: 500 15px system-ui, -apple-system, sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      html, body, #forett-loading { background: #141d17; }
      #forett-loading { color: #e8f2e9; }
      #forett-loading span { color: #b7cbb9; }
    }
  </style>
</head>
<body>
  <div id="forett-loading" role="status" aria-live="polite">
    <img src="icons/Icon-192.png" alt="">
    <div>Forett Shuttle</div>
    <span id="forett-loading-message">Loading…</span>
    <button id="forett-retry" type="button" hidden onclick="location.reload()">Try again</button>
  </div>
  <script>
    window.addEventListener("flutter-first-frame", () => {
      document.getElementById("forett-loading")?.remove();
    }, { once: true });
    window.setTimeout(() => {
      if (!document.getElementById("forett-loading")) return;
      document.getElementById("forett-loading-message").textContent = "Still loading…";
      document.getElementById("forett-retry").hidden = false;
    }, 15000);
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="push_bridge.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
