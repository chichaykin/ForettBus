<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Forett Shuttle timetable, public-bus arrivals, routes and reminders.">
  <meta name="theme-color" content="#F7F9F2">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Forett Shuttle">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Forett Shuttle</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #f7f9f2;
    }

    #forett-loading {
      position: fixed;
      inset: 0;
      z-index: 2147483647;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      box-sizing: border-box;
      padding: 24px;
      color: #203d2b;
      background: #f7f9f2;
      font: 600 20px system-ui, -apple-system, sans-serif;
      text-align: center;
    }

    #forett-loading img {
      width: 88px;
      height: 88px;
      border-radius: 20px;
    }

    #forett-loading span {
      color: #46634e;
      font-size: 15px;
      font-weight: 400;
    }

    #forett-loading button {
      margin-top: 4px;
      padding: 10px 18px;
      border: 1px solid currentColor;
      border-radius: 999px;
      color: inherit;
      background: transparent;
      font: 500 15px system-ui, -apple-system, sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      html, body, #forett-loading { background: #141d17; }
      #forett-loading { color: #e8f2e9; }
      #forett-loading span { color: #b7cbb9; }
    }

    #forett-inapp-banner {
      position: fixed;
      top: max(10px, env(safe-area-inset-top));
      left: max(12px, env(safe-area-inset-left));
      right: max(12px, env(safe-area-inset-right));
      z-index: 2147483640;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 14px;
      border-radius: 14px;
      background: #203d2b;
      color: #ffffff;
      font: 500 13px system-ui, -apple-system, sans-serif;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
    }

    #forett-inapp-banner a {
      display: inline-block;
      white-space: nowrap;
      padding: 6px 12px;
      background: #ffffff;
      color: #203d2b;
      border-radius: 20px;
      font-weight: 600;
      font-size: 12px;
      text-decoration: none;
    }

    #forett-inapp-banner button.forett-inapp-close {
      background: transparent;
      border: none;
      color: #ffffff;
      font-size: 16px;
      line-height: 1;
      padding: 4px;
      cursor: pointer;
      opacity: 0.8;
    }

    #forett-inapp-banner button.forett-inapp-close:hover {
      opacity: 1;
    }

    @media (prefers-color-scheme: dark) {
      #forett-inapp-banner {
        background: #2a4e38;
        color: #e8f2e9;
      }
      #forett-inapp-banner a {
        background: #e8f2e9;
        color: #141d17;
      }
    }
  </style>
</head>
<body>
  <div id="forett-loading" role="status" aria-live="polite">
    <img src="icons/Icon-192.png" alt="">
    <div>Forett Shuttle</div>
    <span id="forett-loading-message">Loading…</span>
    <button id="forett-retry" type="button" hidden onclick="location.reload()">Try again</button>
  </div>
  <script>
    (function checkInApp() {
      try {
        if (sessionStorage.getItem("forett-inapp-dismissed")) return;
      } catch (_) {}

      const ua = navigator.userAgent || "";
      const isAndroid = /Android/i.test(ua);
      const isIOS = /iPhone|iPad|iPod/i.test(ua);
      const isStandalone = (window.navigator.standalone === true) || 
        (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
      if (isStandalone) return;

      const isAndroidWebView = isAndroid && (/;\s*wv|Version\/[\d.]+/i.test(ua) || /HiLife|FBAN|FBAV|Instagram|Telegram/i.test(ua));
      const isIOSInApp = isIOS && (/HiLife|FBAN|FBAV|Instagram|Telegram|Line|MicroMessenger|musical_ly|Snapchat/i.test(ua) || (!/Safari/i.test(ua) && /AppleWebKit/i.test(ua)));

      if (!isAndroidWebView && !isIOSInApp) return;

      const banner = document.createElement("div");
      banner.id = "forett-inapp-banner";
      banner.setAttribute("role", "alert");

      function dismiss() {
        try {
          sessionStorage.setItem("forett-inapp-dismissed", "1");
        } catch (_) {}
        banner.remove();
      }

      if (isAndroidWebView) {
        const intentUrl = "intent://" + location.host + location.pathname + location.search + "#Intent;scheme=https;action=android.intent.action.VIEW;category=android.intent.category.BROWSABLE;end";
        banner.innerHTML = `
          <span>Open in Chrome for Home Screen install & reminders</span>
          <a href="${intentUrl}">Open in Chrome</a>
          <button type="button" class="forett-inapp-close" aria-label="Dismiss">✕</button>
        `;
      } else {
        banner.innerHTML = `
          <span>Tap <b>•••</b> or Share → <b>Open in Safari</b> to install on Home Screen</span>
          <button type="button" class="forett-inapp-close" aria-label="Dismiss">✕</button>
        `;
      }

      banner.querySelector(".forett-inapp-close")?.addEventListener("click", dismiss);
      document.body.appendChild(banner);
    })();
  </script>
  <script>
    window.addEventListener("flutter-first-frame", () => {
      document.getElementById("forett-loading")?.remove();
    }, { once: true });
    window.setTimeout(() => {
      if (!document.getElementById("forett-loading")) return;
      document.getElementById("forett-loading-message").textContent = "Still loading…";
      document.getElementById("forett-retry").hidden = false;
    }, 15000);
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="push_bridge.js"></script>
  <script src="analytics_bridge.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
